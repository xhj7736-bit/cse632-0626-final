apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-student
  template:
    metadata:
      labels:
        app: nginx-student
    spec:
      containers:
      - name: nginx
        image: nginx-student:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: nginx-student
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30080
